<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — АмирДент</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    background:#1b1813;color:#fff;font-family:Manrope,sans-serif;padding:24px}
  .n{font-family:Montserrat,sans-serif;font-weight:900;font-size:clamp(90px,20vw,180px);line-height:1;
    background:linear-gradient(135deg,#dcc493,#9c7f4b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-family:Montserrat,sans-serif;font-size:26px;margin:10px 0 12px}
  p{color:rgba(255,255,255,.65);margin-bottom:28px}
  a{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#dcc493,#9c7f4b);color:#241d10;
    font-family:Montserrat,sans-serif;font-weight:700;text-decoration:none;padding:16px 30px;border-radius:100px}
</style>
</head>
<body>
  <div>
    <div class="n">404</div>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела или страница была перемещена.</p>
    <a href="/">Вернуться на главную</a>
  </div>
</body>
</html>
