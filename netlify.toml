# Публикуется только папка site — в ней нет ничего, кроме страниц сайта.
# Функция лежит вне неё намеренно: всё, что попадает в публикуемую папку,
# скачивается по прямой ссылке, поэтому там не должно быть ни кода функции,
# ни токенов.
#
# Токен и получатель заявок задаются переменными окружения BOT_TOKEN и CHAT_ID
# (Site configuration → Environment variables), локально — в файле .env.

[build]
  command = "npm run build"
  publish = "site"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://static.tildacdn.com https://avatars.mds.yandex.net https://yastatic.net; connect-src 'self'; frame-src https://yandex.ru https://yandex.com; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/smile-*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Адрес /api/lead объявляет сама функция (export const config = { path }).
# Правила для него здесь не нужны и вредны: функция нового поколения доступна
# только по объявленному адресу, а не по /.netlify/functions/<имя>, и попытка
# подменить адрес на второй давала 404.
#
# Прежний адрес нужен для посетителей, у которых в кэше остался старый
# assets/main.js: он отправляет заявки на /api/lead.php. status = 200 подменяет
# адрес без перенаправления браузера, поэтому тело POST-запроса доходит целиком.
[[redirects]]
  from = "/api/lead.php"
  to = "/api/lead"
  status = 200
  force = true

# Контент админки хранится не в файле, а в хранилище Netlify: файл в папке site
# сервер перезаписать не может. Прежний адрес сохранён, чтобы код админки и
# страницы читал контент как раньше; force = true нужен, иначе статический файл
# site/assets/content.json перекрыл бы функцию.
[[redirects]]
  from = "/assets/content.json"
  to = "/api/cms/content"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/prices.html"
  to = "/prices"
  status = 301
  force = true

[[redirects]]
  from = "/prices"
  to = "/prices.html"
  status = 200

[[redirects]]
  from = "/service.html"
  to = "/prices"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200
