# Публикуется только папка site — в ней нет ничего, кроме страниц сайта.
# Функция лежит вне неё намеренно: всё, что попадает в публикуемую папку,
# скачивается по прямой ссылке, поэтому там не должно быть ни кода функции,
# ни токенов.
#
# Токен и получатель заявок задаются переменными окружения BOT_TOKEN и CHAT_ID
# (Site configuration → Environment variables), локально — в файле .env.

[build]
  publish = "site"
  functions = "netlify/functions"

# Адрес /api/lead объявляет сама функция (export const config = { path }).
# Правила для него здесь не нужны и вредны: функция нового поколения доступна
# только по объявленному адресу, а не по /.netlify/functions/<имя>, и попытка
# подменить адрес на второй давала 404.
#
# Прежний адрес нужен для посетителей, у которых в кэше остался старый
# assets/main.js: он отправляет заявки на /api/lead.php. status = 200 подменяет
# адрес без перенаправления браузера, поэтому тело POST-запроса доходит целиком.
[[redirects]]
  from = "/api/lead.php"
  to = "/api/lead"
  status = 200
  force = true

# Контент админки хранится не в файле, а в хранилище Netlify: файл в папке site
# сервер перезаписать не может. Прежний адрес сохранён, чтобы код админки и
# страницы читал контент как раньше; force = true нужен, иначе статический файл
# site/assets/content.json перекрыл бы функцию.
[[redirects]]
  from = "/assets/content.json"
  to = "/api/cms/content"
  status = 200
  force = true

# Страницы направлений: /uslugi/<направление> отдаёт service.html, а он сам
# определяет направление по адресу. Так адреса читаемые и делятся ссылкой,
# а страница остаётся одна — цены и описания не копируются по восьми файлам.
[[redirects]]
  from = "/uslugi/*"
  to = "/service.html"
  status = 200
