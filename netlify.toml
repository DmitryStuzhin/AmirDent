# Публикуется только папка site — в ней нет ничего, кроме страниц сайта.
# Функция лежит вне неё намеренно: всё, что попадает в публикуемую папку,
# скачивается по прямой ссылке, поэтому там не должно быть ни кода функции,
# ни токенов.
#
# Токен и получатель заявок задаются переменными окружения BOT_TOKEN и CHAT_ID
# (Site configuration → Environment variables), локально — в файле .env.

[build]
  publish = "site"
  functions = "netlify/functions"

# Функция сама объявляет адрес /api/lead, правило ниже задаёт его ещё и здесь —
# так адрес работает независимо от версии среды выполнения Netlify.
# status = 200 подменяет адрес без перенаправления браузера, поэтому тело
# POST-запроса доходит до функции целиком.
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

# Прежний адрес: у посетителей, открывших сайт до обновления, в кэше остался
# старый assets/main.js, который отправляет заявки сюда.
[[redirects]]
  from = "/api/lead.php"
  to = "/.netlify/functions/lead"
  status = 200
  force = true
