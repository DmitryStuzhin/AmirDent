<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Вход в админку — АмирДент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=whybento1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  body.admin-login{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:24px}
  body.admin-login::before{content:"";position:fixed;inset:0;background:radial-gradient(70% 60% at 50% 0%,rgba(179,154,107,.28),transparent 65%);pointer-events:none}
  .login-card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--paper);border-radius:var(--r);padding:36px 32px;box-shadow:var(--shadow-lg)}
  .login-card .brand{display:flex;align-items:center;gap:12px;font-family:var(--head);font-weight:800;font-size:22px;margin-bottom:8px}
  .login-card .brand b{color:var(--gold-deep)}
  .login-card .brand .brand-mark{width:44px;height:44px}
  .login-card h1{font-size:22px;margin:18px 0 6px}
  .login-card .hint{color:var(--muted);font-size:14px;margin-bottom:22px}
  .login-card .err{display:none;background:#f8e8e4;color:#7c3c1f;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}
  .login-card .err.show{display:block}
  .login-card .btn{width:100%;margin-top:8px}
  .login-card .back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
  .login-card .back:hover{color:var(--gold-deep)}
</style>
</head>
<body class="admin-login">
  <form class="login-card" id="adminLogin" autocomplete="on">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Амир<b>Дент</b></span></div>
    <h1>Вход для администратора</h1>
    <p class="hint">После входа откроется обычный сайт. Кликайте текст, фото и блоки — чтобы править. Внизу появится панель «Сохранить».</p>
    <div class="err" id="loginErr">Неверный логин или пароль</div>
    <div class="field"><label>Логин</label><input type="text" name="login" required autocomplete="username" placeholder="admin"></div>
    <div class="field"><label>Пароль</label><input type="password" name="password" required autocomplete="current-password"></div>
    <button type="submit" class="btn btn-gold">Войти и править сайт</button>
    <a class="back" href="index.html">← На главную</a>
  </form>
  <script src="assets/cms-auth.js?v=5"></script>
  <script>
    (function(){
      try{
        var raw=sessionStorage.getItem('amirdent_admin_session');
        if(raw){
          var s=JSON.parse(raw);
          if(!s.token) sessionStorage.removeItem('amirdent_admin_session');
        }
      }catch(e){}
      if(window.AmirCMS && AmirCMS.isAuthed()){
        location.replace('index.html');
        return;
      }
      var form=document.getElementById('adminLogin');
      var err=document.getElementById('loginErr');
      form.addEventListener('submit', async function(e){
        e.preventDefault();
        err.classList.remove('show');
        try{
          var ok=await AmirCMS.login(form.login.value.trim(), form.password.value);
          if(!ok){ err.classList.add('show'); return; }
          location.replace('index.html');
        }catch(ex){
          err.textContent=ex.message||'Ошибка входа';
          err.classList.add('show');
        }
      });
    })();
  </script>
</body>
</html>
