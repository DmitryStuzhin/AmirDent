<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Вход в админку — АмирДент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=clamp2">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  body.admin-login{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:24px}
  body.admin-login::before{content:"";position:fixed;inset:0;background:radial-gradient(70% 60% at 50% 0%,rgba(179,154,107,.28),transparent 65%);pointer-events:none}
  .login-card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--paper);border-radius:var(--r);padding:36px 32px;box-shadow:var(--shadow-lg)}
  .login-card .brand{display:flex;align-items:center;gap:12px;font-family:var(--head);font-weight:800;font-size:22px;margin-bottom:8px}
  .login-card .brand b{color:var(--gold-deep)}
  .login-card .brand .brand-mark{width:44px;height:44px}
  .login-card h1{font-size:22px;margin:18px 0 6px}
  .login-card .hint{color:var(--muted);font-size:14px;margin-bottom:22px}
  .login-card .err{display:none;background:#f8e8e4;color:#7c3c1f;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:14px}
  .login-card .err.show{display:block}
  .login-card .btn{width:100%;margin-top:8px}
  .login-card .back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
  .login-card .back:hover{color:var(--gold-deep)}
  .login-card .pass-wrap{position:relative}
  .login-card .pass-wrap input{padding-right:52px}
  .login-card .pass-toggle{
    position:absolute;right:8px;bottom:8px;width:40px;height:40px;
    border:0;border-radius:10px;background:transparent;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;
  }
  .login-card .pass-toggle:hover{color:var(--gold-deep);background:rgba(179,154,107,.12)}
  .login-card .pass-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .login-card .pass-toggle svg{width:22px;height:22px;display:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  /* Пароль скрыт → глаз с чертой. Пароль виден → открытый глаз. */
  .login-card .pass-toggle .icon-eye-off{display:block}
  .login-card .pass-toggle.is-on .icon-eye-off{display:none}
  .login-card .pass-toggle.is-on .icon-eye{display:block}
</style>
</head>
<body class="admin-login">
  <form class="login-card" id="adminLogin" autocomplete="on">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Амир<b>Дент</b></span></div>
    <h1>Вход для администратора</h1>
    <p class="hint">После входа откроется обычный сайт. Кликайте текст, фото и блоки — чтобы править. Внизу появится панель «Сохранить».</p>
    <div class="err" id="loginErr">Неверный логин или пароль</div>
    <div class="field"><label for="adminLoginField">Логин</label><input id="adminLoginField" type="text" name="login" required autocomplete="username"></div>
    <div class="field">
      <label for="adminPasswordField">Пароль</label>
      <div class="pass-wrap">
        <input id="adminPasswordField" type="password" name="password" required autocomplete="current-password">
        <button type="button" class="pass-toggle" id="togglePassword" aria-label="Показать пароль" aria-controls="adminPasswordField" aria-pressed="false" title="Показать пароль">
          <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-gold">Войти и править сайт</button>
    <a class="back" href="/">← На главную</a>
  </form>
  <script src="assets/cms-auth.js?v=b12auth2"></script>
  <script>
    (function(){
      var form=document.getElementById('adminLogin');
      var err=document.getElementById('loginErr');
      var pass=document.getElementById('adminPasswordField');
      var toggle=document.getElementById('togglePassword');

      function goEditSite(){
        AmirCMS.enterEditMode();
        location.replace('/');
      }

      function setPasswordVisible(visible){
        pass.type=visible?'text':'password';
        toggle.classList.toggle('is-on', visible);
        toggle.setAttribute('aria-pressed', visible?'true':'false');
        toggle.setAttribute('aria-label', visible?'Скрыть пароль':'Показать пароль');
        toggle.title=visible?'Скрыть пароль':'Показать пароль';
      }
      setPasswordVisible(false);
      toggle.addEventListener('click', function(){
        setPasswordVisible(pass.type==='password');
      });

      // Всегда форма входа: сбрасываем старую cookie и флаг правки
      if(AmirCMS.exitEditMode) AmirCMS.exitEditMode();
      var sessionCleared=AmirCMS.logout
        ? AmirCMS.logout().catch(function(){})
        : Promise.resolve();
      form.addEventListener('submit', async function(e){
        e.preventDefault();
        err.classList.remove('show');
        try{
          await sessionCleared;
          var ok=await AmirCMS.login(form.login.value.trim(), form.password.value);
          if(!ok){ err.classList.add('show'); return; }
          goEditSite();
        }catch(ex){
          err.textContent=ex.message||'Ошибка входа';
          err.classList.add('show');
        }
      });
    })();
  </script>
</body>
</html>
